# CI:push/PR → 全量单测(离线自洽,无需任何密钥;H2 内存库 + offline 桩)
# 仓库未带 mvnw,使用 runner 预装 Maven;缓存 ~/.m2 加速依赖解析
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: mvn -B -ntp test
