server:
  port: 8080

spring:
  application:
    name: dolphin
  # ---- 持久化:默认 H2 文件模式(./data/dolphin),零外部依赖即落库;生产切 mysql profile ----
  datasource:
    url: jdbc:h2:file:./data/dolphin
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Schema 由 Flyway 版本化迁移管理(db/migration),启动只校验实体与表结构一致;
      # 漂移即启动失败(可控),杜绝 update 模式的静默变更与不可审计
      ddl-auto: validate
    open-in-view: false
  flyway:
    # 存量 ./data H2 文件库为 ddl-auto 时代建表(无迁移历史):首次启动自动打基线,
    # 视同已到 V1,此后增量变更一律走 V2+;全新库(测试/新环境)则正常执行 V1
    baseline-on-migrate: true
    baseline-version: 1
  ai:
    openai:
      # 百炼 Coding Plan 专用 OpenAI 兼容端点(base-url 不带 /v1,Spring AI 会自动拼接)
      base-url: ${DOLPHIN_BASE_URL:https://coding.dashscope.aliyuncs.com}
      # API Key 只从环境变量读取,严禁写入本文件(避免提交到 git)
      api-key: ${DOLPHIN_API_KEY}
      chat:
        options:
          # Coding Plan 套餐内模型,可按控制台支持的列表更换
          model: ${DOLPHIN_MODEL:qwen3.7-plus}
      # RAG 用 Embedding 模型(OpenAI 兼容协议走同一 base-url/api-key)。
      # 注意:若 Coding Plan 端点不支持 /v1/embeddings,把 DOLPHIN_BASE_URL 换成
      # https://dashscope.aliyuncs.com/compatible-mode/v1 并使用普通 DashScope Key
      embedding:
        options:
          model: ${DOLPHIN_EMBED_MODEL:text-embedding-v4}

logging:
  level:
    com.dolphin: DEBUG

dolphin:
  # ---- 告警自动诊断(M2:alert_task 匹配 → Agent 诊断 → 钉钉通知)----------------
  alert:
    dingtalk:
      # 自定义机器人 webhook(含 access_token);空=通知降级为审计日志(offline 演示无需配置)
      webhook-url: ${DOLPHIN_DINGTALK_WEBHOOK_URL:}
      # 机器人"加签"密钥;空=不加签。凭证只从环境变量注入,禁止写死
      secret: ${DOLPHIN_DINGTALK_SECRET:}
    # alert_task 目录:按 alertname(+可选 labels 子集)匹配,命中则异步触发 Agent 诊断;
    # context-template 中 {key} 占位符由告警 labels 渲染(与 deploy/prometheus/alert-rules.yml 的规则对应)
    tasks:
      - name: 模型5xx高错误率
        alert-name: ModelHttp5xxRateHigh
        product: 模型推理服务
        context-template: "推理服务持续返回 5xx,uid={uid},model={model},5xx 速率超过 0.1 次/秒,请结合服务状态给出诊断。"
      - name: 模型限流
        alert-name: ModelThrottled
        product: 模型推理服务
        context-template: "推理服务触发限流,uid={uid},model={model},429 速率超过 0.1 次/秒,请结合配额与服务状态给出诊断。"

  approval:
    # 审批令牌有效期(支持 10m/30s 等简写,缺省 10 分钟)
    token-ttl: ${DOLPHIN_APPROVAL_TOKEN_TTL:10m}
    # 审批令牌 HMAC 签名密钥:生产环境必须通过环境变量固定配置;
    # 缺省时启动随机生成临时密钥(进程重启后旧令牌全部失效,启动日志会 WARN)
    token-secret: ${DOLPHIN_APPROVAL_TOKEN_SECRET:}

  # ---- 异步受理(阶段 O8:受理即 202,图执行移入独立线程池)--------------------
  async:
    # 图执行线程池大小(并发跑图的工单数上限);队列无界,受理必达
    pool-size: ${DOLPHIN_ASYNC_POOL_SIZE:4}
    # SSE 连接超时(0=不超时;终态时服务端主动 complete,断开由回调清理)
    sse-timeout: ${DOLPHIN_ASYNC_SSE_TIMEOUT:0s}

  # ---- SLA 优先级与超时升级(阶段3:P1~P4 双计时器,SlaMonitor 周期巡检)-----------
  sla:
    # 响应时限:卡在 NEW/RUNNING/PROCESSING(尚未产出客户可见回复)超过时限 → 升级人工池+加急;
    # PROCESSING 兜底 = 异步图执行卡死(线程丢失/云调用悬挂)时的超时补偿
    response:
      P1: 5m
      P2: 30m
      P3: 60m
      P4: 240m
    # 解决时限:未 CLOSED(含待审批/转人工)超过时限 → 升级人工池+加急
    resolve:
      P1: 30m
      P2: 2h
      P3: 8h
      P4: 24h
    # 巡检周期(演示/测试可配 10s 缩短观察窗口)
    scan-interval: ${DOLPHIN_SLA_SCAN_INTERVAL:60s}
    # 启动后首次巡检延迟(避开启动高峰)
    scan-initial-delay: ${DOLPHIN_SLA_SCAN_INITIAL_DELAY:30s}

  # ---- 云服务数据源(可插拔:模拟器 / HTTP 真实云)----------------------------
  # 骨架期全部为 mock 值:provider=sim 时根本不读 cloud.* ;provider=http 时
  # base-url 默认指向本应用自己的 /__mock 端点,无外网即可跑通全链路。
  cloud:
    # 数据源实现:sim=进程内模拟器(默认,offline 演示与单测) | http=HTTP 对接真实云/平台网关
    provider: ${DOLPHIN_CLOUD_PROVIDER:sim}
    # http 实现的目标根地址;接真实云时把这里换成真实网关
    base-url: ${DOLPHIN_CLOUD_BASE_URL:http://localhost:8080/__mock}
    connect-timeout: ${DOLPHIN_CLOUD_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${DOLPHIN_CLOUD_READ_TIMEOUT:PT10S}
    retry:
      # 只对读方法生效;写方法绝不自动重试(避免重复重启/重复退款)
      read-max-attempts: ${DOLPHIN_CLOUD_READ_MAX_ATTEMPTS:2}
    auth:
      # none=不鉴权 | bearer=固定 token | ak-sk=AK/SK 签名
      mode: ${DOLPHIN_CLOUD_AUTH_MODE:none}
      # 凭证只从环境变量/密钥服务注入,禁止在此写死明文
      token: ${DOLPHIN_CLOUD_TOKEN:mock-token}
      access-key: ${DOLPHIN_CLOUD_AK:}
      secret-key: ${DOLPHIN_CLOUD_SK:}
    probe:
      enabled: ${DOLPHIN_CLOUD_PROBE_ENABLED:true}
      # PROBE 范式的探测目标兜底主机(真实环境填实例可达地址)
      target-host: ${DOLPHIN_CLOUD_PROBE_TARGET_HOST:127.0.0.1}
    paths:
      # 路径模板集中配置:换网关/换 API 版本只改这里,不动 Java 代码
      instance: /v1/instances/{instanceId}
      instance-reboot: /v1/instances/{instanceId}/reboot
      instance-metrics: /v1/instances/{instanceId}/metrics
      order-refund: /v1/orders/{orderId}/refund
      order-refund-latest: /v1/orders/{orderId}/refunds/latest
      security-group-rules: /v1/security-groups/{sgId}/rules
      security-group-probe: /v1/security-groups/{sgId}/probe

---
# ---- 生产 profile:mysql(-Dspring.profiles.active=mysql 激活,覆盖默认 H2 数据源)----
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DOLPHIN_DB_HOST:localhost}:3306/${DOLPHIN_DB_NAME:dolphin}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DOLPHIN_DB_USER:root}
    password: ${DOLPHIN_DB_PASSWORD:}
  jpa:
    hibernate:
      # V1 基线为 H2 方言;真接 MySQL 时另立迁移系列(或按 vendor 目录拆分),此前先由 Hibernate 建表
      ddl-auto: update
  flyway:
    enabled: false
